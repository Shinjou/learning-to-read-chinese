// Plugins block must be at the top
plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// Move other Gradle configurations below the plugins block
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.8.0' // was 1.0

android {
    namespace "org.chengzhiedu.ltrc"
    
    // Replace flutter.compileSdkVersion with the actual SDK version
    compileSdkVersion 33  // Replace with your required SDK version

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "org.chengzhiedu.ltrc"

        // Set minSdkVersion and targetSdkVersion directly
        minSdkVersion 21  // Set to the appropriate minimum SDK version
        targetSdkVersion 33  // Set to the appropriate target SDK version

        versionCode flutterVersionCode.toInteger()  // You can keep this logic
        versionName flutterVersionName  // You can keep this logic
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            debuggable false
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}

// Apply Flutter's Gradle plugin (must be at the end)
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
